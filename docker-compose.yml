services:

  ######################################################

  postgres:
    image: postgres:15
    container_name: durak-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Схема БД auth применяется контейнером migrate-auth (Liquibase).
      # Здесь остаётся только создание вспомогательных БД (matchmaking).
      - ./backend/services/authService/postgresql/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - durak-network
    restart: unless-stopped

  ######################################################

  redis:
    image: redis:7
    container_name: durak-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6379"
      - "26379"
    command: >
      sh -c 'redis-server --requirepass "$${REDIS_PASSWORD}" &
             printf "port 26379\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel monitor mymaster redis 6379 2\nsentinel auth-pass mymaster $${REDIS_PASSWORD}\nsentinel down-after-milliseconds mymaster 3000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\nsentinel announce-ip redis\nsentinel announce-port 26379\n" > /tmp/sentinel.conf &&
             exec redis-sentinel /tmp/sentinel.conf'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - durak-network
    restart: unless-stopped

  ######################################################

  auth-service:
    build:
      context: ./backend/services/authService
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - DB_CONNECTION=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DB_NAME}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrate-auth:
        condition: service_completed_successfully
    networks:
      - durak-network
    restart: unless-stopped

  ######################################################

  migrate-auth:
    image: liquibase/liquibase:4.27
    command: >
      --url=jdbc:postgresql://postgres:5432/${AUTH_DB_NAME}
      --username=${POSTGRES_USER}
      --password=${POSTGRES_PASSWORD}
      --changelog-file=db.changelog-master.xml
      --search-path=/liquibase/changelog
      update
    volumes:
      - ./backend/services/authService/postgresql/migrations:/liquibase/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - durak-network

  ######################################################

  game-service:
    build:
      context: ./backend/services/gameService
      dockerfile: Dockerfile
      args:
        BUILD_TYPE: ${BUILD_TYPE}
    expose:
      - "8080"
    environment:
      # абсолютный путь внутри контейнера (env читается config_vars.docker.yaml)
      - SECDIST_PATH=/etc/gameService/secure_data.json
    volumes:
      - ./backend/services/gameService/configs/config_vars.docker.yaml:/etc/gameService/config_vars.yaml:ro
      - ${SECDIST_FILE}:/etc/gameService/secure_data.json:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - durak-network
    restart: unless-stopped

  ######################################################

  matchmaking-service:
    build:
      context: ./backend/services/matchmakingService
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - MATCHMAKING_SERVICE_PORT=8080
      - AUTH_URL=http://auth-service:8080
      - GAME_URL=http://game-service:8080
      - MATCHMAKING_DSN=host=postgres port=5432 dbname=matchmaking user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}
      - REDIS_SENTINEL_HOST=redis
      - REDIS_SENTINEL_PORT=26379
      - REDIS_MASTER_NAME=mymaster
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - durak-network
    restart: unless-stopped

  ######################################################

  lobby-service:
    build:
      context: ./backend/services/lobbyService
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - LOBBY_SERVICE_PORT=8080
      - AUTH_URL=http://auth-service:8080
      - LOBBY_DB_PATH=/app/data/lobby.db
      - REDIS_SENTINEL_HOST=redis
      - REDIS_SENTINEL_PORT=26379
      - REDIS_MASTER_NAME=mymaster
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./backend/services/lobbyService/data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - durak-network
    restart: unless-stopped

  ######################################################

  api-gateway:
    build:
      context: ./backend/gateways/apiGateway
      dockerfile: Dockerfile
      args:
        BUILD_TYPE: ${BUILD_TYPE}
    expose:
      - "8080"
    environment:
      - OAUTH_TOKEN_CHECK_ENABLED=${OAUTH_TOKEN_CHECK_ENABLED}
    depends_on:
      - auth-service
      - lobby-service
      - matchmaking-service
      - game-service
    networks:
      - durak-network
    restart: unless-stopped

  ######################################################

  realtime-gateway:
    build:
      context: ./backend/gateways/realtimeGateway
      dockerfile: Dockerfile
      args:
        BUILD_TYPE: ${BUILD_TYPE}
    expose:
      - "8080"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - auth-service
      - lobby-service
      - matchmaking-service
      - game-service
      - redis
    networks:
      - durak-network
    restart: unless-stopped

  ######################################################

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:8080"
    environment:
      # включаем Google-вход: из шаблона js/oauth.js.template генерируем js/oauth.js
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      # ./frontend монтируется без :ro — nginx дописывает сгенерированный js/oauth.js
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    command: >
      /bin/sh -c "envsubst '$${GOOGLE_CLIENT_ID}'
      < /usr/share/nginx/html/js/oauth.js.template
      > /usr/share/nginx/html/js/oauth.js &&
      exec nginx -g 'daemon off;'"
    depends_on:
      - api-gateway
      - realtime-gateway
    networks:
      - durak-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  durak-network:
    driver: bridge
