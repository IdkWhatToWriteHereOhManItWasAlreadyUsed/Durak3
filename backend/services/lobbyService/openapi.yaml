openapi: 3.0.3
info:
  title: Durak Lobby Service
  version: 1.1.0
  description: >
    Учёт присутствия игроков. Заменяет периодическую рассылку
    `SERVER:CLIENTS:...` из DurakSharpServer: клиент сам сообщает о себе
    (heartbeat), а список онлайн-игроков отдаётся по запросу и/или пушится
    по WebSocket через gateway.

    Аутентификации внутри сервиса нет: доступен только изнутри домена.
    `id` игрока приходит в запросе; для действий от имени игрока его
    подставляет api-gateway из opaque-токена.
servers:
  - url: http://localhost:8082
    description: Локальная разработка
tags:
  - name: Presence

paths:
  /presence:
    post:
      tags: [Presence]
      summary: Войти в лобби (отметить себя онлайн)
      description: >
        Регистрирует сессию присутствия. Возвращает `sessionId`, который
        нужно периодически «пинговать» через /presence/{sessionId}/heartbeat.

        `id` в теле — кто открывает присутствие; подставляется api-gateway
        из токена (клиентское значение игнорируется).
      operationId: openPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceOpenRequest'
      responses:
        '201':
          description: Присутствие зарегистрировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presence'

    get:
      tags: [Presence]
      summary: Список онлайн-игроков
      description: Аналог `SERVER:CLIENTS:<id>:<name>,...`.
      operationId: listOnline
      parameters:
        - name: excludeSelf
          in: query
          schema: { type: boolean, default: true }
        - name: id
          in: query
          description: ID текущего игрока (для excludeSelf); подставляется гейтвеем из токена
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Онлайн-игроки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineList'

  /presence/{sessionId}:
    delete:
      tags: [Presence]
      summary: Выйти из лобби
      operationId: closePresence
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Присутствие закрыто
        '404':
          $ref: '#/components/responses/NotFound'

  /presence/{sessionId}/heartbeat:
    post:
      tags: [Presence]
      summary: Продлить присутствие (heartbeat)
      description: Клиент вызывает раз в N секунд, иначе сессия истекает.
      operationId: heartbeat
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Обновлённая сессия присутствия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presence'
        '404':
          $ref: '#/components/responses/NotFound'

  /presence/{id}/status:
    get:
      tags: [Presence]
      summary: Статус конкретного игрока
      operationId: getStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Статус
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceStatus'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      # NOTE: format: uuid намеренно не указан — chaotic v3_3_rc генерирует
      # некорректный TrivialParameter для path-параметров с format: uuid.
      # Валидация UUID выполняется в хендлере (boost::uuids::string_generator).
      schema: { type: string }

  responses:
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    PresenceOpenRequest:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: ID игрока (заполняется гейтвеем из токена)
        status:
          type: string
          enum: [in_lobby, in_game, away]
          default: in_lobby
        clientVersion: { type: string, example: "1.0.0" }
    Presence:
      type: object
      required: [sessionId, id, name, status, lastSeen]
      properties:
        sessionId: { type: string, format: uuid }
        id:
          type: integer
          description: ID игрока
        name: { type: string }
        status:
          type: string
          enum: [in_lobby, in_game, away]
        lastSeen: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    PresenceStatus:
      type: object
      required: [id, online]
      properties:
        id:
          type: integer
          description: ID игрока
        online: { type: boolean }
        status:
          type: string
          enum: [in_lobby, in_game, away]
        lastSeen: { type: string, format: date-time }
    OnlineList:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Presence' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: NOT_FOUND }
        message: { type: string, example: Presence session not found }