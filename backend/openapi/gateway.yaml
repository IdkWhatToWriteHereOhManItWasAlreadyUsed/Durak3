openapi: 3.0.3
info:
  title: Durak API Gateway (BFF)
  version: 1.1.0
  description: |
    Единая точка входа для клиента. Агрегирует REST-вызовы к микросервисам и
    держит WebSocket-соединение для realtime-событий (список онлайн-игроков,
    приглашения, ходы партии).

    ## Аутентификация

    Авторизация выполняется через Google OAuth2 в Auth Service.
    BFF проксирует `POST /auth/google` → клиент получает **UUID accessToken**
    (это НЕ JWT — это opaque-токен сессии, хранящийся в БД auth-service,
    TTL 30 дней).

    Все защищённые эндпоинты требуют заголовок:

        Authorization: Bearer <accessToken>

    BFF валидирует токен, вызывая `GET /auth/me` у auth-service (с кэшем
    на 30–60 секунд), и проксирует `playerId` вниз по стеку.

    ## WebSocket

    `GET /ws?token=<accessToken>` (HTTP Upgrade). После подключения сервер
    шлёт клиенту события в формате `{ "type": "...", "payload": {...} }`:

    | type | payload | Аналог в оригинале |
    |---|---|---|
    | `lobby.players` | `{ items: [{playerId,name,status}] }` | `SERVER:CLIENTS:...` |
    | `presence.online` / `presence.offline` | `{ playerId, name }` | появление/уход |
    | `invite.created` | `Invite` | `GO?` |
    | `invite.accepted` | `Match` | `GO!` |
    | `invite.declined` | `Invite` | `NO!` |
    | `game.started` | `GameState` | `PLAYER0:...DECK:...` |
    | `game.state` | `GameState` | новое состояние |
    | `game.move` | `AppliedMove` | `CARD:x;STACK:y`, `MOVE`, `GRAB` |
    | `game.finished` | `GameResult` | `WIN` |

    Клиент может слать команды: `invite.create`, `invite.accept`,
    `invite.decline`, `game.move`, `presence.heartbeat`. Ответ доставляется
    событием, ошибки — `error`.
servers:
  - url: http://localhost:8080
    description: Локальная разработка
tags:
  - name: Auth
  - name: Lobby
  - name: Matchmaking
  - name: Game
  - name: Replay
  - name: Realtime

paths:
  # ------------------------------- Auth -----------------------------------
  /api/auth/google:
    post:
      tags: [Auth]
      summary: Вход через Google OAuth2 (проксирует auth-service)
      description: >
        Обменивает Google authorization code на UUID-токен сессии.
        Если пользователь с таким google_id ещё не существует — создаёт его.
      operationId: gatewayGoogleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code:
                  type: string
                  description: Authorization code от Google
                redirect_uri:
                  type: string
                  format: uri
                  description: Должен совпадать с тем, что передавался в Google
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь (проксирует auth-service)
      operationId: gatewayMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Идентификатор пользователя
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    delete:
      tags: [Auth]
      summary: Выход (удаляет сессию, проксирует auth-service)
      operationId: gatewayLogout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сессия удалена, тело пустое
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/users/{userId}:
    get:
      tags: [Auth]
      summary: Публичный профиль пользователя (проксирует auth-service)
      operationId: gatewayUserById
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '404':
          $ref: '#/components/responses/Error'

  # ------------------------------- Lobby ----------------------------------
  /api/lobby/players:
    get:
      tags: [Lobby]
      summary: Список онлайн-игроков
      description: Агрегирует lobby-service (presence) + auth-service (имена).
      operationId: gatewayOnlinePlayers
      security:
        - bearerAuth: []
      parameters:
        - name: excludeSelf
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Онлайн-игроки
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OnlinePlayer' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/lobby/heartbeat:
    post:
      tags: [Lobby]
      summary: Heartbeat присутствия
      operationId: gatewayHeartbeat
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Принято
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------- Matchmaking -------------------------------
  /api/invites:
    post:
      tags: [Matchmaking]
      summary: Пригласить игрока
      operationId: gatewayCreateInvite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toPlayerId]
              properties:
                toPlayerId: { type: integer }
                ttlSeconds: { type: integer, minimum: 5, maximum: 120, default: 30 }
      responses:
        '201':
          description: Приглашение создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '409':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Matchmaking]
      summary: Мои приглашения
      operationId: gatewayListInvites
      security:
        - bearerAuth: []
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [incoming, outgoing, all], default: all }
      responses:
        '200':
          description: Приглашения
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/invites/{inviteId}/accept:
    post:
      tags: [Matchmaking]
      summary: Принять приглашение (создаёт матч и партию)
      operationId: gatewayAcceptInvite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Матч создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '409':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/invites/{inviteId}/decline:
    post:
      tags: [Matchmaking]
      summary: Отклонить приглашение
      operationId: gatewayDeclineInvite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Отклонено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # -------------------------------- Game ----------------------------------
  /api/games/{gameId}:
    get:
      tags: [Game]
      summary: Состояние партии
      operationId: gatewayGameState
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Состояние партии
          content:
            application/json:
              schema: { $ref: './game-service.yaml#/components/schemas/GameState' }
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/games/{gameId}/moves:
    post:
      tags: [Game]
      summary: Сделать ход
      operationId: gatewayMakeMove
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './game-service.yaml#/components/schemas/MoveRequest' }
      responses:
        '200':
          description: Новое состояние
          content:
            application/json:
              schema: { $ref: './game-service.yaml#/components/schemas/GameState' }
        '409':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/games/{gameId}/resign:
    post:
      tags: [Game]
      summary: Сдаться
      operationId: gatewayResign
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Партия завершена
          content:
            application/json:
              schema: { $ref: './game-service.yaml#/components/schemas/GameResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------- Replay ---------------------------------
  /api/replays:
    get:
      tags: [Replay]
      summary: Список повторов
      operationId: gatewayListReplays
      parameters:
        - name: playerId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Повторы
          content:
            application/json:
              schema: { $ref: './replay-service.yaml#/components/schemas/ReplayList' }

  /api/replays/{replayId}:
    get:
      tags: [Replay]
      summary: Получить повтор
      operationId: gatewayGetReplay
      parameters:
        - $ref: '#/components/parameters/ReplayId'
      responses:
        '200':
          description: Повтор
          content:
            application/json:
              schema: { $ref: './replay-service.yaml#/components/schemas/Replay' }
        '404':
          $ref: '#/components/responses/Error'

  # ------------------------------ Realtime --------------------------------
  /ws:
    get:
      tags: [Realtime]
      summary: WebSocket-канал realtime-событий
      description: |
        Апгрейд до WebSocket. Требует opaque-токен сессии (`accessToken`,
        полученный из `/api/auth/google`) в query-параметре `token`.
        BFF валидирует токен через `GET /auth/me` перед Upgrade.
        Формат и перечень событий — в info.description.
      operationId: websocket
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '101':
          description: Switching Protocols
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: >
        UUID-токен сессии, выдаётся Auth Service при логине через Google.
        Хранится в БД auth-service. Не JWT. Передавать как
        `Authorization: Bearer <token>`. TTL 30 дней.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReplayId:
      name: replayId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Токен не передан, невалиден или сессия истекла
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid or expired token

  schemas:
    AuthResponse:
      type: object
      required: [id, email, username, accessToken]
      properties:
        id: { type: integer, description: Внутренний ID пользователя }
        email: { type: string, format: email }
        username: { type: string }
        accessToken:
          type: string
          description: UUID токен сессии (opaque, не JWT)
    MeResponse:
      type: object
      required: [id]
      properties:
        id: { type: integer }
    PublicUser:
      type: object
      required: [id, username]
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
    OnlinePlayer:
      type: object
      required: [playerId, name]
      properties:
        playerId: { type: integer }
        name: { type: string }
        status: { type: string, enum: [in_lobby, in_game, away] }
        lastSeen: { type: string, format: date-time }
    Invite:
      type: object
      required: [id, fromPlayerId, toPlayerId, status]
      properties:
        id: { type: string, format: uuid }
        fromPlayerId: { type: integer }
        fromName: { type: string }
        toPlayerId: { type: integer }
        toName: { type: string }
        status: { type: string, enum: [pending, accepted, declined, expired, cancelled] }
        expiresAt: { type: string, format: date-time }
    Match:
      type: object
      required: [id, gameId, players, status]
      properties:
        id: { type: string, format: uuid }
        gameId: { type: string, format: uuid }
        status: { type: string, enum: [active, finished] }
        players:
          type: array
          items:
            type: object
            properties:
              playerId: { type: integer }
              name: { type: string }
              seat: { type: integer }
              isFirstAttacker: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: BAD_REQUEST }
        message: { type: string, example: Invalid request }