user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $uri $loggable_request {
        /ws      "$request_method $uri $server_protocol";
        default  "$request";
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$loggable_request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 10m;

    upstream api_gateway {
        server api-gateway:8080;
        keepalive 32;
    }

    upstream realtime_gateway {
        server realtime-gateway:8080;
        keepalive 32;
    }


    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- HTTP → HTTPS (если есть TLS) ----------
    # Раскомментировать, когда появится сертификат.
    # server {
    #     listen 80;
    #     server_name durak.example.com;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        server_name _;

        # Если TLS — раскомментировать и добавить listen 443 ssl + сертификаты.
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        location /ws {
            proxy_pass http://realtime_gateway;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;

            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://api_gateway;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}